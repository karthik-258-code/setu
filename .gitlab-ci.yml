# Mirrors .github/workflows/ci.yml while the repo lives on GitLab.
image: node:20

stages: [verify]

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

cache:
  key:
    files: [pnpm-lock.yaml]
  paths: [.pnpm-store]

verify:
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm lint
    - pnpm test
    - pnpm content:validate
    - pnpm build
