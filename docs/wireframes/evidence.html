<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: Evidence drawer</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; background: #eee; }
  .phone { max-width: 360px; margin: 16px auto; background: #ccc; border: 2px solid #333; border-radius: 16px; height: 640px; position: relative; overflow: hidden; }
  .behind { padding: 12px; color: #666; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid #333; border-radius: 14px 14px 0 0; padding: 12px; max-height: 70%; overflow: auto; }
  .bar { display: flex; justify-content: space-between; }
  .box { border: 1px solid #999; border-radius: 6px; padding: 8px; margin: 6px 0; }
  .muted { color: #666; font-size: 13px; }
  .tag { background: #fd9; padding: 2px 6px; font-size: 13px; display: inline-block; }
</style>
</head>
<body>
<div class="phone">
  <div class="behind">Gap Map (dimmed behind the drawer)</div>
  <div class="sheet">
    <div class="bar"><div><b>Ravi</b><br><span class="muted">Adding unlike fractions</span></div><span>Close</span></div>
    <div class="box">
      <div class="muted">readiness &middot; 2026-10-26</div>
      1/2 + 1/3 = ?<br>
      Answered: 2/5 <b>(Wrong)</b><br>
      <span class="tag">Adds the denominators</span>
    </div>
    <div class="box">
      <div class="muted">readiness &middot; 2026-10-26</div>
      Which fraction equals 2/3?<br>
      Answered: 4/6 <b>(Right)</b>
    </div>
    <div class="muted">Newest first. Every cell on the Gap Map can be explained this way.</div>
  </div>
</div>
</body>
</html>
